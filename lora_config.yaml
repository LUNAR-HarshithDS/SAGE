model: "Qwen/Qwen3-1.7B-MLX-bf16"
train: true
fine_tune_type: lora
optimizer: adamw
data: "data"
seed: 42
num_layers: 4
batch_size: 1
iters: 300
val_batches: -1
learning_rate: 1e-5
steps_per_report: 10
steps_per_eval: 50
grad_accumulation_steps: 1
resume_adapter_file: null
adapter_path: "adapters/sage-1.7b"
save_every: 50
max_seq_length: 1024
grad_checkpoint: true
lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.v_proj"
  rank: 8
  scale: 20.0
  dropout: 0.0
